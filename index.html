<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Träning">
<meta name="theme-color" content="#15171a">
<title>Träningslogg</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<style>
/* Färger efter tävlingsviktskivor: blå 20 kg = handling, gul 15 kg = rekord, grön 10 kg = klart/i zonen, röd 25 kg = ta bort */
:root{
  color-scheme:dark;
  --bg:#15171a; --surface-1:#1e2125; --surface-2:#292d32; --surface-3:#33383e; --border:#30353b; --grid:#2a2e33;
  --text-primary:#f3f2ee; --text-secondary:#b7b6b0; --text-muted:#8a8b8f;
  --plate-blue:#2e6be6; --plate-yellow:#f2c230; --plate-green:#2bb36a; --plate-red:#e5484d;
  --series-1:var(--plate-blue); --accent:var(--plate-blue); --danger:var(--plate-red);
  --display:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--plate-blue);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:rgba(21,23,26,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;border-bottom:1px solid var(--grid)}
header .in{max-width:720px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{margin:0;font:700 26px/1 var(--display);letter-spacing:.01em}
header .wk{font:600 15px/1 var(--display);color:var(--text-muted);letter-spacing:.02em}
header .wk b{color:var(--text-primary);font-weight:700}
main{max-width:720px;margin:0 auto;padding:16px 16px 70px}

nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;display:flex;max-width:560px;margin:0 auto;background:rgba(36,39,44,.9);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border:1px solid var(--border);border-radius:22px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--text-muted);padding:7px 0 6px;font:inherit;font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:17px;transition:color .15s,background .15s}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
nav button.active{color:var(--text-primary);background:var(--surface-3)}
nav button.active svg{stroke:var(--plate-blue)}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
h2{font:700 22px/1.1 var(--display);letter-spacing:.01em;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:22px 0 8px;color:var(--text-primary)}
label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:5px}
input,textarea,select{width:100%;background:var(--surface-2);border:1px solid transparent;color:var(--text-primary);border-radius:var(--r-md);padding:11px 12px;font:inherit;font-size:16px;transition:border-color .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
textarea{min-height:68px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--plate-blue);background:var(--surface-3)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-primary);border-radius:var(--r-md);padding:11px 16px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--plate-blue);border-color:var(--plate-blue);color:#fff;font-weight:600}
.btn.danger{color:var(--plate-red)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{flex:1;width:100%}
.row{display:flex;gap:8px;align-items:center}
.mb{margin-bottom:8px}
.mt{margin-top:10px}
.muted{color:var(--text-muted)}
.small{font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;user-select:none;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--plate-blue);border-color:var(--plate-blue);color:#fff}
.chip[data-act="useTpl"]{background:var(--surface-2);color:var(--text-primary);border-color:transparent;font-weight:500}
.tag{display:inline-block;background:var(--surface-2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--text-secondary);margin:2px 4px 2px 0}

.ex{border-radius:var(--r-md);padding:10px;margin-bottom:8px;background:var(--bg);border:1px solid var(--grid)}
.ex>.row input{background:transparent;padding-left:4px;font-weight:600}
.ex>.row input:focus{background:var(--surface-2)}
.hint{font-size:12px;color:var(--text-muted);margin:2px 4px 8px;min-height:0}
.hint:empty{display:none}
.setrow,.setshead{display:grid;grid-template-columns:1.2fr 1fr 1fr 36px;gap:6px;margin-bottom:6px}
.setshead{font-size:11px;color:var(--text-muted);margin-bottom:3px;padding-left:6px}
.setrow input{padding:9px 10px;font:600 19px/1 var(--display);text-align:center;letter-spacing:.01em}
.setrow .btn,.ex>.row .btn{background:transparent;border-color:transparent;color:var(--text-muted)}

.week{margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.week b{font:700 20px/1 var(--display);letter-spacing:.01em}
.strip{display:flex;gap:3px}
.strip span{width:20px;height:20px;border-radius:6px;background:var(--surface-2);font-size:10px;color:var(--text-muted);display:flex;align-items:center;justify-content:center}
.strip span.on{background:var(--plate-blue);color:#fff;font-weight:600}
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sess-head b{font:700 20px/1.1 var(--display);letter-spacing:.01em}
.sess-head .btn.small{background:transparent;border-color:transparent;color:var(--text-muted)}
.exline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--grid);font-size:14px}
.exline span:last-child{color:var(--text-secondary);text-align:right;font-variant-numeric:tabular-nums}

/* Siffrorna är appens signatur: stora, smala, som stämplingen på en viktskiva */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface-1);padding:14px 16px 13px}
.tile .v{font:700 46px/.95 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .l{font-size:12px;color:var(--text-secondary);margin-top:5px;line-height:1.3}

svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--text-muted);font-size:11px;font-family:inherit}
.mbar,.vbar{display:grid;grid-template-columns:92px 1fr 112px;gap:10px;align-items:center;font-size:14px;margin-bottom:9px}
.mbar .track,.vbar .track{position:relative;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.mbar .fill{height:100%;background:var(--plate-blue);border-radius:999px}
.mbar .r,.vbar .r{color:var(--text-muted);font-size:12px;text-align:right;white-space:nowrap}
.vbar .zone{position:absolute;top:0;bottom:0;background:rgba(43,179,106,.16)}
.vbar .fill{position:relative;height:100%;background:var(--plate-blue);border-radius:999px}
.vbar.in .fill{background:var(--plate-green)}
.vbar .r b{color:var(--text-primary);font:700 16px/1 var(--display)}
.vbar.in .r{color:var(--plate-green)}

#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface-3);border:1px solid #444a51;color:var(--text-primary);border-radius:10px;padding:8px 11px;font-size:13px;white-space:pre-line;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text-primary);color:var(--bg);font-weight:600;padding:11px 18px;border-radius:999px;z-index:30;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .22s ease-out;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
[hidden]{display:none!important}
.seg{margin:28px 2px 10px;font:700 20px/1.1 var(--display);letter-spacing:.01em;color:var(--text-primary)}
.seg b{font-weight:inherit}
.seg:first-child{margin-top:4px}
.way{padding:12px 0;border-top:1px solid var(--grid)}
.way:first-of-type{border-top:0;padding-top:0}
.way>b{display:block;margin-bottom:2px}
.ss{display:inline-block;font:700 13px/1.35 var(--display);background:rgba(46,107,230,.18);color:#7fa6f2;border-radius:6px;padding:0 6px;margin-right:4px;letter-spacing:.03em}

.sheet{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-head{padding:12px 16px;border-bottom:1px solid var(--grid);max-width:720px;width:100%;margin:0 auto}
.sheet-head b{font:700 24px/1 var(--display)!important}
.pbody{flex:1;display:flex;flex-direction:column;min-height:0;max-width:720px;width:100%;margin:0 auto}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--grid);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtabs .chip{white-space:nowrap;flex:none}
.plist{flex:1;overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.pitem{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--grid);cursor:pointer;user-select:none}
.pitem .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface-3);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;transition:background .12s,border-color .12s}
.pitem.on .box{background:var(--plate-blue);border-color:var(--plate-blue)}
.pitem.done{opacity:.45;cursor:default}
.pitem.done .box{background:var(--surface-3);border-color:var(--surface-3)}
.pitem .nm{flex:1}

.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(242,194,48,.08);border:1px solid rgba(242,194,48,.35);border-radius:var(--r-md);padding:10px 10px 10px 14px;margin-bottom:12px;font-size:14px}
.banner .btn{background:var(--plate-yellow);border-color:var(--plate-yellow);color:#1b1708}
.pr{font:700 12px/1.4 var(--display);letter-spacing:.04em;background:var(--plate-yellow);color:#1b1708;border-radius:999px;padding:1px 8px;white-space:nowrap}
.card.due{border-color:rgba(46,107,230,.6);box-shadow:inset 3px 0 0 var(--plate-blue)}
.badge{background:var(--plate-blue);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}

/* Hem: nästa pass är den enda färgstarka ytan – en blå 20-kilosskiva */
.card.hero{background:var(--plate-blue);border-color:var(--plate-blue);box-shadow:none;padding:18px;position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.08);box-shadow:0 0 0 22px rgba(255,255,255,.04)}
.card.hero>*{position:relative;z-index:1}
.card.hero .sess-head b{font-size:30px}
.card.hero .badge{background:rgba(255,255,255,.18)}
.card.hero .muted{color:rgba(255,255,255,.75)}
.card.hero .btn.primary{background:#fff;border-color:#fff;color:#0f2d6b}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.modal-box{background:var(--surface-1);border:1px solid var(--border);border-top:4px solid var(--plate-yellow);border-radius:var(--r-lg);padding:24px;max-width:360px;width:100%;text-align:center;animation:pop2 .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop2{from{transform:scale(.9);opacity:0}}
.modal-box h2{font-size:30px;color:var(--plate-yellow)}
.modal-box p{margin:6px 0;color:var(--text-secondary)}

.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;min-width:52px;height:52px;border-radius:26px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-primary);font:700 22px/1 var(--display);padding:0 15px;box-shadow:0 8px 22px rgba(0,0,0,.5);cursor:pointer;font-variant-numeric:tabular-nums}
.fab.running{background:var(--plate-blue);border-color:var(--plate-blue);color:#fff}
.fab.done{background:var(--plate-green);border-color:var(--plate-green);color:#fff;font-size:19px}
.timer{position:fixed;right:16px;bottom:calc(152px + env(safe-area-inset-bottom));z-index:7;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.55);text-align:center}
.timer .row{justify-content:center}
.tbig{font:700 64px/1 var(--display);font-variant-numeric:tabular-nums;margin-bottom:12px}
details summary{cursor:pointer;color:var(--text-secondary);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px;border-top:1px solid var(--grid)}
th{color:var(--text-muted);font-weight:500}
.up{color:var(--plate-green)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</nav>

<script>
// PARSER START
const DOW=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
const DOW_SHORT=['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
const MONTHS=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const MUSCLES=['Bröst','Rygg','Biceps','Triceps','Axlar','Ben','Vader','Mage','Sneda mage','Core','Underarmar'];

const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=fromISO(s);d.setDate(d.getDate()+n);return toISO(d)};
const todayISO=()=>toISO(new Date());
const diffDays=(a,b)=>Math.round((fromISO(b)-fromISO(a))/864e5);
const mondayOf=s=>addDays(s,-((fromISO(s).getDay()+6)%7));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const addU=(a,v)=>{if(!a.includes(v))a.push(v)};

// Fritext-muskelgrupper ("lite rygg", "weighted ab", "obq stående" ...)
const MODS=/(^|\s)(lätt|lite|semi|weighted|stående|övre|mindre|tung|tungt)(?=\s|$)/g;
const MUSCLE_WORDS=[[/^bröst$/,'Bröst'],[/^bi(ceps)?$/,'Biceps'],[/^tri(ceps)?$/,'Triceps'],[/^(rygg|lats)$/,'Rygg'],
  [/^(ab|abs|mage)$/,'Mage'],[/^(obq|obl|sneda( mage)?)$/,'Sneda mage'],[/^core$/,'Core'],[/^(sido ?)?planka$/,'Core'],
  [/^ben$/,'Ben'],[/^vader?$/,'Vader'],[/^underarm(ar)?$/,'Underarmar'],[/^(delt|delts|axlar)$/,'Axlar']];
function muscleOf(s){
  s=s.toLowerCase().replace(MODS,' ').replace(/\s+/g,' ').trim();
  for(const[r,g]of MUSCLE_WORDS)if(r.test(s))return g;
  return null;
}
// Muskelgrupper som en övning automatiskt räknas till i statistiken
const IMPLIED=[[/curl|\bbi\b/,'Biceps'],[/^incline(?!.*\bbi\b)|chest p(ress|r)?\b|bänk|flyes|dips/,'Bröst'],
  [/row|lats|shrug|rev fly/,'Rygg'],[/\btri|dips/,'Triceps'],[/utfall|squat|knäböj|marklyft/,'Ben'],
  [/delt|axelpress/,'Axlar'],[/leg raise|planka/,'Core']];
const ALIASES={'chest p':'chest press','chest pr':'chest press','seated curl':'sittande curl maskin',
  'bänk press':'bänkpress','bench press':'bänkpress','leg raises':'leg raise','hangling leg raise i maskin':'hängande leg raise',
  'bulg split squat':'bulgarian split squat','chest support row':'chest supported row','chest row':'chest supported row',
  'over heard tri':'overhead tri','cable curls':'cable curl','one arm':'triceps one arm','rows wide grip':'wide grip row'};

function mkEx(name,sets,note){
  name=name.replace(/[@:\s-]+$/,'').replace(/\s+/g,' ').trim().toLowerCase();
  name=ALIASES[name]||name;
  if(name==='incline'&&sets[0]&&sets[0].w>=100)name='incline maskin';
  const e={name:cap(name),sets};
  if(note)e.note=note;
  return e;
}

function parseExercise(tok){
  let t=tok.replace(/(\d),(\d)/g,'$1.$2'),note='';
  const q=t.match(/\s+(\S+\?)\s*$/); if(q){note=q[1];t=t.slice(0,q.index)}
  const ms=[...t.matchAll(/(\d+(?:\.\d+)?)\s*kg/gi)];
  if(!ms.length){
    const lm=t.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
    return lm?mkEx(lm[2],[{w:+lm[1]}],note):mkEx(t,[],note);
  }
  let name='',carry=t.slice(0,ms[0].index),trailing='';
  const sets=[];
  ms.forEach((m,i)=>{
    const e={w:+m[1]};
    const p=carry.match(/(\d+)\s*x?\s*(?:st|sets?)?\s*@?\s*$/i);
    if(p&&/x|st|set|@/i.test(p[0])){e.sets=+p[1];carry=carry.slice(0,p.index)}
    if(/drop/i.test(carry))e.note='drop set';
    if(i===0)name=carry;
    let after=t.slice(m.index+m[0].length,i+1<ms.length?ms[i+1].index:t.length),a;
    if((a=after.match(/^\s*x?\s*(\d+)\s*x\s*(\d+(?:-\d+)?)/i))){e.sets=+a[1];e.reps=a[2]}
    else if((a=after.match(/^\s*x\s*(\d+)\s*(?:sets?|st)\b/i))){e.sets=+a[1]}
    else if((a=after.match(/^\s*x\s*(\d+(?:-\d+)?)/i))){e.reps=a[1]}
    carry=a?after.slice(a[0].length):after;
    sets.push(e);
  });
  trailing=carry.trim();
  if(trailing&&!/drop/i.test(trailing))name=(name+' '+trailing).trim(); // t.ex. "rows 50kg wide grip"
  return mkEx(name,sets,note);
}

// Tolkar en dags text, t.ex. "bröst, bi, incline 155kg, sittande curl maskin 57,5kg x1"
function parseSession(text){
  const s={id:uid(),date:'',muscles:[],exercises:[],cardio:[],notes:'',raw:text.trim()};
  const notes=[];let any=false;
  const toks=text.split(/,(?!\d)|\s-\s|!|;|\n/).map(t=>t.trim()).filter(Boolean);
  for(const tok of toks){
    const low=tok.toLowerCase();
    if(/^vila$/.test(low))continue;
    any=true;
    let m;
    if((m=low.match(/(\d+)\s*kcal/))){
      const type=low.replace(/\d+\s*kcal/,'').trim();
      s.cardio.push({type:/band/.test(type)||!type?'Löpband':cap(type),kcal:+m[1]});continue;
    }
    if(/^(walk|promenad|gå|löpning|cykel)$/.test(low)){s.cardio.push({type:low==='walk'?'Promenad':cap(low),kcal:null});continue}
    const mg=muscleOf(low); if(mg){addU(s.muscles,mg);continue}
    if(/fokus/.test(low)){notes.push(tok);continue}
    const ex=parseExercise(tok);
    if(!ex.name){
      const prev=s.exercises[s.exercises.length-1];
      if(prev&&ex.sets.length){prev.sets.push(...ex.sets);continue}
      notes.push(tok);continue;
    }
    const words=ex.name.split(' ');
    if(words.length>=3&&muscleOf(words[0])){addU(s.muscles,muscleOf(words[0]));ex.name=mkEx(words.slice(1).join(' '),ex.sets).name}
    s.exercises.push(ex);
  }
  if(!any)return null;
  s.notes=notes.join('. ');
  return s;
}

// Tolkar en hel logg med veckodagar. Sista raden antas vara endISO (eller närmast föregående matchande veckodag).
function parseLog(text,endISO){
  const D='(måndag|tisdag|onsdag|torsdag|fredag|lördag|söndag)';
  const re=new RegExp('^'+D+'\\s*(?:-\\s*'+D+')?\\s*[:;]\\s*(.*)$','i');
  const blocks=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim().replace(/^["”“]|["”“]$/g,'');if(!line)continue;
    const m=line.match(re);
    if(m)blocks.push({from:m[1].toLowerCase(),to:(m[2]||m[1]).toLowerCase(),content:m[3].trim()});
    else if(blocks.length)blocks[blocks.length-1].content+=', '+line;
  }
  const days=[];
  for(const b of blocks){
    let d=DOW.indexOf(b.from);const end=DOW.indexOf(b.to);
    for(let i=0;i<7;i++){days.push({dow:d,content:b.content});if(d===end)break;d=(d+1)%7}
  }
  if(!days.length)return [];
  let date=endISO;
  for(let i=days.length-1;i>=0;i--){
    if(i<days.length-1)date=addDays(date,-1);
    while(fromISO(date).getDay()!==days[i].dow)date=addDays(date,-1);
    days[i].date=date;
  }
  return days;
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum=n=>String(n).replace('.',',');
const fmtDate=(s,withDow=true)=>{const d=fromISO(s);return (withDow?cap(DOW[d.getDay()])+' ':'')+d.getDate()+' '+MONTHS[d.getMonth()]};
function fmtSet(x){
  let s=x.w!=null?fmtNum(x.w)+' kg':'';
  if(x.sets&&x.reps)s+=` ${x.sets}×${x.reps}`;
  else if(x.sets)s+=` · ${x.sets} set`;
  else if(x.reps)s+=` × ${x.reps}`;
  if(x.note)s+=` (${x.note})`;
  return s.trim();
}
const fmtSets=e=>e.sets.map(fmtSet).filter(Boolean).join(', ');
const maxW=e=>Math.max(-Infinity,...e.sets.map(x=>x.w).filter(w=>w!=null));
function musclesOf(s){
  const set=new Set(s.muscles);
  for(const e of s.exercises){const n=e.name.toLowerCase();for(const[r,g]of IMPLIED)if(r.test(n))set.add(g)}
  return[...set];
}
function isoWeek(s){
  const t=fromISO(s);t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1=new Date(t.getFullYear(),0,4,12);
  return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7);
}

  return Object.values(c).sort((a,b)=>b.n-a.n);
}
function findRecords(s){ // jämför mot alla andra pass
  const out=[];
  for(const e of s.exercises){
    const w=maxW(e),k=e.name.toLowerCase();if(!isFinite(w))continue;
    let best=-Infinity;
    for(const o of db.sessions)if(o.id!==s.id)for(const oe of o.exercises)if(oe.name.toLowerCase()===k)best=Math.max(best,maxW(oe));
    if(isFinite(best)&&w>best)out.push(`${e.name}: ${fmtNum(w)} kg (förra rekordet ${fmtNum(best)} kg)`);
  }
  return out;
}

    clearDraft(){if(confirm('Rensa formuläret?')){draft=newDraft();render()}},

    del(){if(confirm('Ta bort passet?')){db.sessions=db.sessions.filter(s=>s.id!==b.dataset.id);save();render()}},
    rename(){
      const old=b.dataset.name,nn=prompt(`Byt namn på "${old}" i alla pass.\nSkriv ett befintligt namn för att slå ihop övningarna.`,old);
      if(!nn||!nn.trim())return;

      selEx=nn.trim().toLowerCase();save();render();toast(`${c} pass uppdaterade`);
    },
    async exportJson(){
      const name=`traningslogg-${todayISO()}.json`,blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
      const file=new File([blob],name,{type:'application/json'});

        else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
        db.lastBackup=todayISO();save();toast('Backup sparad ✓');render();

/* ---------- Övningsväljare ---------- */
// "Namn|Muskelgrupp" när övningen ska räknas till en annan grupp än kategorin
const CATALOG={
  'Bröst':['Incline maskin','Incline smith','Incline hantel','Chest press','Bänkpress','Flyes','Cable flyes','Pec deck','Dips'],
  'Rygg':['Chest supported row','Wide grip row','Rows maskin','Latsdrag','Pull-ups','Hantelrodd','Rev fly','Kelso shrug','Marklyft'],
  'Biceps':['Sittande curl maskin','Bi maskin','Barbell curl','Hammer curl','Incline bi','Cable curl','Preacher curl'],
  'Triceps':['Overhead tri','Triceps one arm','Triceps pushdown','Skull crushers','Dips|Triceps'],
  'Axlar':['Axelpress','Side delt','Rear delt','Face pulls','Front raises'],
  'Ben':['Bulgarian split squat','Utfall','Knäböj','Benpress','Lårcurl','Benspark','Rumänsk marklyft'],
  'Vader':['Vadpress','Stående vadpress'],
  'Mage & core':['Weighted ab|Mage','Cable crunch|Mage','Obq stående|Sneda mage','Russian twist|Sneda mage','Sidoplanka|Sneda mage','Hängande leg raise|Core','Leg raise|Core','Planka|Core'],
  'Underarmar':['Underarmscurl','Omvänd curl','Farmers walk'],
};
const GROUPS=[...Object.keys(CATALOG),'Övrigt'];
const groupOfMuscle=m=>['Mage','Sneda mage','Core'].includes(m)?'Mage & core':m;
const muscleOfGroup=g=>g==='Mage & core'?'Mage':g==='Övrigt'?null:g;
function buildCatalog(){
  const cat={},seen=new Set(),usage={};GROUPS.forEach(g=>cat[g]=[]);
  const add=(g,name,muscle,custom)=>{const k=name.toLowerCase();if(cat[g].some(x=>x.k===k))return;cat[g].push({k,name,muscle,custom});seen.add(k)};
  for(const g in CATALOG)for(const s of CATALOG[g]){const[n,m]=s.split('|');add(g,n,m||muscleOfGroup(g))}
  for(const c of db.customEx||[])add(c.group,c.name,c.muscle,true);
  // Övningar från historiken som inte finns i listan sorteras in automatiskt
  for(const s of db.sessions)for(const e of s.exercises){
    const k=e.name.toLowerCase();usage[k]=(usage[k]||0)+1;
    if(!seen.has(k)){const hit=IMPLIED.find(([r])=>r.test(k));add(hit?groupOfMuscle(hit[1]):'Övrigt',e.name,hit&&hit[1])}
  }
  for(const g of GROUPS)cat[g].sort((a,b)=>(usage[b.k]||0)-(usage[a.k]||0)); // mest använda först
  return cat;
}
let pk=null;
function openPicker(){
  pk={group:draft.muscles[0]?groupOfMuscle(draft.muscles[0]):'Bröst',sel:new Map(),q:'',items:{}};
  const el=document.createElement('div');el.className='sheet';el.id='picker';
  el.innerHTML=`<div class="sheet-head"><div class="row"><b style="flex:1;font-size:17px">Välj övningar</b>
    <button class="btn" data-p="cancel">Avbryt</button><button class="btn primary" data-p="done" id="pdone">Klar</button></div>
    <input id="pq" class="mt" type="search" placeholder="Sök övning…" autocomplete="off"></div><div id="pbody" class="pbody"></div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  el.querySelector('#pq').oninput=e=>{pk.q=e.target.value;renderPicker()};
  el.onclick=pickerClick;
  renderPicker();
}
function closePicker(apply){
  if(apply)for(const[k,it]of pk.sel){
    if(draft.exercises.some(e=>e.name.toLowerCase()===k))continue;
    const sg=suggestFor(it.name);
    draft.exercises.push({name:it.name,sets:[{w:sg?sg.last:null,sets:null,reps:''}]});
    if(it.muscle&&MUSCLES.includes(it.muscle))addU(draft.muscles,it.muscle);
  }
  document.getElementById('picker').remove();document.body.style.overflow='';
  const n=pk.sel.size;pk=null;
  if(apply&&n){render();toast(`${n} övning${n>1?'ar':''} tillagd${n>1?'a':''}`)}
}
function renderPicker(){
  const cat=buildCatalog(),q=pk.q.trim().toLowerCase();
  const inDraft=new Set(draft.exercises.map(e=>e.name.toLowerCase()));
  let items;
  if(q){const all=new Map();for(const g of GROUPS)for(const it of cat[g])if(it.k.includes(q)&&!all.has(it.k))all.set(it.k,it);items=[...all.values()]}
  else items=cat[pk.group];
  items.forEach(it=>pk.items[it.k]=it);
  document.getElementById('pbody').innerHTML=
    (q?'':`<div class="gtabs">${GROUPS.filter(g=>cat[g].length||g===pk.group).map(g=>`<span class="chip ${g===pk.group?'on':''}" data-g="${esc(g)}">${esc(g)}</span>`).join('')}</div>`)+
    `<div class="plist">${items.map(it=>{
      const on=pk.sel.has(it.k),done=inDraft.has(it.k),sg=suggestFor(it.name);
      return `<div class="pitem ${on?'on':''} ${done?'done':''}" data-k="${esc(it.k)}"><span class="box">${on||done?'✓':''}</span>
        <span class="nm">${esc(it.name)}${done?' <span class="muted small">(redan tillagd)</span>':''}<br><span class="muted small">${sg?`senast ${fmtNum(sg.last)} kg · rekord ${fmtNum(sg.best)} kg`:'ej kört än'}</span></span>
        ${it.custom?`<button class="btn small danger" data-delc="${esc(it.k)}" aria-label="Ta bort övning">✕</button>`:''}</div>`}).join('')||'<p class="muted">Inga träffar.</p>'}
    <button class="btn block mt" data-p="new">+ Ny övning ${q?`”${esc(pk.q.trim())}”`:`i ${esc(pk.group)}`}</button></div>`;
  updDone();
}
function updDone(){document.getElementById('pdone').textContent=pk.sel.size?`Klar (${pk.sel.size})`:'Klar'}
function pickerClick(e){
  const t=e.target;
  const delc=t.closest('[data-delc]');
  if(delc){e.stopPropagation();const k=delc.dataset.delc;if(confirm('Ta bort övningen från listan? Loggade pass påverkas inte.')){db.customEx=(db.customEx||[]).filter(c=>c.name.toLowerCase()!==k);pk.sel.delete(k);save();renderPicker()}return}
  const p=t.closest('[data-p]');
  if(p){
    if(p.dataset.p==='cancel')closePicker(false);
    else if(p.dataset.p==='done')closePicker(true);
    else{
      const name=prompt(`Namn på ny övning (${pk.group}):`,pk.q.trim());if(!name||!name.trim())return;
      const it={name:cap(name.trim()),group:pk.group,muscle:muscleOfGroup(pk.group)};
      db.customEx=db.customEx||[];
      if(!db.customEx.some(c=>c.name.toLowerCase()===it.name.toLowerCase()))db.customEx.push(it);
      save();pk.sel.set(it.name.toLowerCase(),it);
      pk.q='';document.getElementById('pq').value='';renderPicker();
    }
    return;
  }
  const g=t.closest('[data-g]');if(g){pk.group=g.dataset.g;renderPicker();document.querySelector('.plist').scrollTop=0;return}
  const row=t.closest('.pitem');
  if(row&&!row.classList.contains('done')){
    const k=row.dataset.k;
    if(pk.sel.has(k))pk.sel.delete(k);else pk.sel.set(k,pk.items[k]);
    row.classList.toggle('on');row.querySelector('.box').textContent=pk.sel.has(k)?'✓':'';updDone();
  }
}

let prMarks=new Set();
function computePrMarks(){
  const best={},set=new Set();
  for(const s of [...db.sessions].reverse())for(const e of s.exercises){
    const w=maxW(e),k=e.name.toLowerCase();if(!isFinite(w))continue;
    if(k in best&&w>best[k])set.add(s.id+'|'+k);
    if(!(k in best)||w>best[k])best[k]=w;
  }
  return set;
}

/* ---------- Förslag / mallar ---------- */
function exHistory(name){ // tyngsta vikt per pass, äldst först
  const k=name.toLowerCase(),out=[];
  for(const s of [...db.sessions].reverse())for(const e of s.exercises)if(e.name.toLowerCase()===k){const w=maxW(e);if(isFinite(w))out.push({date:s.date,w})}
  return out;
}
function suggestFor(name){
  const h=exHistory(name);if(!h.length)return null;
  const last=h[h.length-1],prev=h[h.length-2],best=Math.max(...h.map(x=>x.w));
  // Samma vikt två pass i rad → dags att prova lite tyngre
  const up=prev&&last.w>=prev.w&&last.w===best;
  return{last:last.w,best,date:last.date,up,next:up?last.w+2.5:last.w};
}
function loadTemplate(t){
  t.muscles.forEach(m=>addU(draft.muscles,m));
  if(!draft.tpl)draft.tpl=t.id;
  for(const it of t.items){
    if(draft.exercises.some(e=>e.name.toLowerCase()===it.name.toLowerCase()))continue;
    const sg=suggestFor(it.name),ex={name:it.name,sets:[{w:sg?sg.last:null,sets:it.sets||null,reps:'',target:it.reps||''}]};
    if(it.ss)ex.note='superset '+it.ss[0];
    draft.exercises.push(ex);
  }
}
function lastTrained(t){
  const main=t.muscles.slice(0,2);
  const s=db.sessions.find(s=>s.date<=todayISO()&&main.some(m=>musclesOf(s).includes(m)));
  return s?diffDays(s.date,todayISO()):null;
}
function tplCard(t,{badge='',sub=''}={}){

      <span>${sg?(sg.up?`<b class="up">↑ ${fmtNum(sg.next)} kg</b>`:`${fmtNum(sg.next)} kg`):'–'}</span></div>`}).join('')}

}

// Set per muskelgrupp under en vecka. Saknas antal set räknas 3 set per övning,
// och en ikryssad muskelgrupp utan övningar räknas som 6 set (uppskattning).
const VOL_GROUPS=['Bröst','Rygg','Axlar','Biceps','Triceps','Ben','Vader','Mage & core','Underarmar'];
function exMuscles(name){
  const k=name.toLowerCase(),out=new Set();
  for(const g in CATALOG)for(const s of CATALOG[g]){const[n,m]=s.split('|');if(n.toLowerCase()===k)out.add(m||muscleOfGroup(g))}
  for(const c of db.customEx||[])if(c.name.toLowerCase()===k&&c.muscle)out.add(c.muscle);
  for(const[r,m]of IMPLIED)if(r.test(k))out.add(m);
  return[...out];
}
function exSetCount(e){
  if(e.sets.some(x=>x.sets))return{n:e.sets.reduce((a,x)=>a+(x.sets||1),0),est:false};
  if(e.sets.length>1)return{n:e.sets.length,est:false};
  return{n:3,est:true};
}
function weeklySets(mon){
  const vol={};VOL_GROUPS.forEach(g=>vol[g]={n:0,est:false});
  const end=addDays(mon,6);
  for(const s of db.sessions){
    if(s.date<mon||s.date>end)continue;
    const hit=new Set();
    for(const e of s.exercises){
      const c=exSetCount(e),gs=new Set(exMuscles(e.name).map(groupOfMuscle));
      for(const g of gs)if(vol[g]){vol[g].n+=c.n;vol[g].est=vol[g].est||c.est;hit.add(g)}
    }
    for(const g of new Set(s.muscles.map(groupOfMuscle)))if(vol[g]&&!hit.has(g)){vol[g].n+=6;vol[g].est=true}
  }
  return vol;
}
function volBars(vol,prev,groups){
  const MAXV=24,pct=v=>Math.min(100,v/MAXV*100);
  return groups.map(g=>{const v=vol[g],n=v.n;
    const st=n>=20?'över 20':n>=10?'i zonen':`${10-n} kvar`;
    return `<div class="vbar${n>=10?' in':''}" data-tip="${esc(`${g}: ${v.est?'≈':''}${n} set denna vecka${v.est?' (delvis uppskattat)':''}\nFörra veckan: ${prev[g].est?'≈':''}${prev[g].n} set\nMål: 10–20 set`)}">
      <span>${g}</span><div class="track"><div class="zone" style="left:${pct(10)}%;width:${pct(20)-pct(10)}%"></div><div class="fill" style="width:${pct(n)}%"></div></div>
      <span class="r"><b>${v.est&&n?'≈':''}${n}</b> · ${st}</span></div>`}).join('');
}
function recentPRs(n){ // nya rekord, senaste först
  const best={},out=[];
  for(const s of [...db.sessions].reverse())for(const e of s.exercises){
    const w=maxW(e),k=e.name.toLowerCase();if(!isFinite(w))continue;
    if(k in best&&w>best[k])out.push({date:s.date,name:e.name,w,prev:best[k]});
    if(!(k in best)||w>best[k])best[k]=w;
  }
  return out.reverse().slice(0,n);
}
// Kör du helkroppsprogrammet föreslås nästa A/B/C, annars den dagstyp som vilat längst
function nextTemplate(){
  const fb=db.templates.filter(t=>t.prog==='fb');
  const lastFb=t=>{const s=db.sessions.find(s=>s.tpl===t.id);return s?s.date:''};
  if(fb.some(lastFb))return{t:[...fb].sort((a,b)=>lastFb(a).localeCompare(lastFb(b)))[0],why:'Nästa i helkroppsprogrammet'};
  const rows=db.templates.filter(t=>!t.prog).map(t=>({t,since:lastTrained(t)}));
  if(!rows.length)return null;
  const r=rows.reduce((a,r)=>(r.since??999)>(a.since??999)?r:a);
  return{t:r.t,why:r.since==null?'Aldrig kört':`Längst sedan – ${r.since} d`};
}

  view.innerHTML=`${backupBanner()}

      <div class="tile"><div class="v">${prs30}</div><div class="l">Nya rekord senaste 30 d</div></div>
    </div>
    ${nx?`<div class="card hero"><div class="sess-head"><b>${esc(nx.t.name)}</b><span class="badge">Förslag</span></div>
      <div class="muted small" style="margin:2px 0 8px">${esc(nx.why)}</div>
      <div class="small" style="margin-bottom:10px">${nx.t.items.map(it=>{const sg=suggestFor(it.name);return esc(it.name)+(sg?` <span class="muted">${sg.up?'↑ ':''}${fmtNum(sg.next)} kg</span>`:'')}).join(' · ')}</div>
      <button class="btn primary block" data-act="useTpl" data-id="${nx.t.id}">Starta passet</button></div>`:''}
    <div class="card"><h2>Veckans volym</h2>
      <div class="muted small" style="margin-bottom:10px">Set per muskelgrupp. Mål 10–20 set (grön zon).</div>
      ${volBars(vol,prev,VOL_GROUPS)}
      <div class="small mt">${under.length?`👉 <b>Under 10 set:</b> ${under.join(', ')}`:'💪 Alla stora muskelgrupper är i zonen.'}</div></div>
    <div class="card"><h2>Pass per vecka</h2>${barChart(weeks)}</div>
    <div class="card"><h2>Senaste rekord</h2>
      ${prs.length?prs.map(p=>`<div class="exline"><span>🏆 ${esc(p.name)} <span class="muted small">${fmtDate(p.date,false)}</span></span><span><b style="color:var(--text-primary)">${fmtNum(p.w)} kg</b> <span class="muted small">(+${fmtNum(Math.round((p.w-p.prev)*10)/10)})</span></span></div>`).join(''):'<p class="muted small">Inga rekord än – logga vikter så dyker de upp här.</p>'}</div>
    ${lastS?`<div class="seg"><b>Senaste passet</b></div>${sessionCard(lastS)}`:''}`;
}
function renderSuggest(){
  const today=todayISO(),mon=mondayOf(today),vol=weeklySets(mon),prev=weeklySets(addDays(mon,-7));
  const days=new Set(db.sessions.filter(s=>s.date>=mon&&s.date<=today).map(s=>s.date)).size;
  const daysLeft=diffDays(today,addDays(mon,6))+1;
  const volRows=volBars(vol,prev,VOL_GROUPS);
  const under=VOL_GROUPS.filter(g=>vol[g].n<10&&!['Vader','Underarmar'].includes(g));

  const fb=db.templates.filter(t=>t.prog==='fb');
  const lastFb=t=>{const s=db.sessions.find(s=>s.tpl===t.id);return s?s.date:''};
  const nextFb=fb.length?[...fb].sort((a,b)=>lastFb(a).localeCompare(lastFb(b)))[0]:null;
  const fbDone=new Set(db.sessions.filter(s=>s.date>=mon&&fb.some(t=>t.id===s.tpl)).map(s=>s.date)).size;

  const rows=db.templates.filter(t=>!t.prog).map(t=>({t,since:lastTrained(t)}));
  const due=rows.reduce((a,r)=>((r.since??999)>(a?(a.since??999):-1)?r:a),null);

  view.innerHTML=`
  <div class="seg"><b>Forskningsbaserat</b></div>
  <div class="card">
    <h2>Veckans volym</h2>
    <div class="muted small" style="margin-bottom:10px">Set per muskelgrupp vecka ${isoWeek(mon)}. Målet för bäst resultat är <b>10–20 set per muskel och vecka</b> (grön zon).</div>
    ${volRows}
    <div class="small mt">${under.length?`👉 <b>Under 10 set:</b> ${under.join(', ')}. ${daysLeft>1?`${daysLeft} dagar kvar av veckan.`:'Sista dagen i veckan.'}`:'💪 Alla stora muskelgrupper är i zonen den här veckan.'}</div>
    <details class="mt"><summary>Hur räknas det?</summary><div class="small muted mt">Set du har loggat räknas som de är. Saknas antal set räknas en övning som 3 set, och en ikryssad muskelgrupp utan övningar som 6 set – då visas ≈. Logga antal set för exakta siffror. Övningar räknas till alla muskler de träffar (t.ex. dips = bröst + triceps).</div></details>
  </div>

  <div class="card">
    <h2>Två vägar</h2>
    <div class="way"><b>🏆 Maximal tillväxt</b><div class="small muted">10–20 set per muskel och vecka. Bäst resultat i jämförelsen gav <b>helkropp 3 dagar/vecka med supersets</b> – varje muskel tränas oftare utan att de sista seten blir sämre.</div></div>
    <div class="way"><b>⚖️ Hållbart</b><div class="small muted">4–5 dagar/vecka på <b>60–70 % av max</b> – avsluta varje set med ungefär 3–4 reps kvar i tanken. Bra resultat utan att bo på gymmet.</div>
      <div class="small mt">Den här veckan: <b>${days} av 4–5 dagar</b>${days>=4?' ✓':days+daysLeft-(db.sessions.some(s=>s.date===today)?1:0)>=4?` – ${4-days} pass kvar att hinna`:''}</div></div>
    <div class="small muted mt">Bygger på sammanfattningen du klistrade in från en enskild studie. Ta det som en riktlinje, inte en exakt sanning.</div>
  </div>

  ${fb.length?`<div class="seg"><b>Helkropp 3 dagar/vecka med supersets</b></div>
  <div class="muted small" style="margin-bottom:10px">Kör A, B och C med minst en vilodag emellan, t.ex. mån–ons–fre. Övningar med samma bokstav (A1 + A2) är ett superset: kör A1, direkt A2, vila ~90 s, upprepa. ${fbDone?`Denna vecka: <b>${fbDone} av 3</b> helkroppspass.`:''}</div>
  ${fb.map(t=>{const l=lastFb(t);return tplCard(t,{badge:t===nextFb?'Nästa':'',sub:(l?`Senast ${fmtDate(l,false)}`:'Inte kört än')+' · hela kroppen'})}).join('')}`:''}

  <div class="seg"><b>Dina dagstyper</b></div>
  <div class="muted small" style="margin-bottom:12px">Vikterna bygger på din historik – ↑ betyder att du kört samma vikt två gånger i rad och kan prova 2,5 kg mer.</div>
  ${rows.map(({t,since})=>tplCard(t,{badge:due&&due.t===t?'Dags för':'',sub:`${since==null?'Aldrig kört':since===0?'Kört idag':`Senast för ${since} d sedan`} · ${t.muscles.map(esc).join(', ')}`})).join('')}
  <div class="muted small">Egna mallar skapar du under Logga → “Spara som mall”.</div>`;
}

/* ---------- Statistik ---------- */
let selEx=null;
function barChart(data){
  const W=640,H=190,pl=26,pr=6,pt=18,pb=24,ymax=Math.max(1,...data.map(d=>d.value)),step=ymax>8?2:1;
  const cw=(W-pl-pr)/data.length,bw=Math.min(40,cw-6),y=v=>pt+(H-pt-pb)*(1-v/ymax),base=y(0);
  let g='';
  for(let v=0;v<=ymax;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  data.forEach((d,i)=>{
    const x=pl+i*cw+(cw-bw)/2,top=y(d.value),r=Math.min(4,base-top);
    if(d.value>0)g+=`<path d="M${x},${base}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${base}Z" fill="var(--series-1)"/>`;
    if(i%2===(data.length-1)%2)g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(d.label)}</text>`;
    if(i===data.length-1)g+=`<text x="${x+bw/2}" y="${top-6}" text-anchor="middle" style="fill:var(--text-primary);font-weight:600">${d.value}</text>`;
    g+=`<rect x="${pl+i*cw}" y="${pt}" width="${cw}" height="${base-pt}" fill="transparent" data-tip="${esc(d.tip)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pass per vecka">${g}</svg>`;
}
function lineChart(pts){
  const W=640,H=220,pl=40,pr=14,pt=16,pb=26;
  const vals=pts.map(p=>p.value);let lo=Math.min(...vals),hi=Math.max(...vals);
  const padV=Math.max(2.5,(hi-lo)*.15);lo=Math.max(0,Math.floor((lo-padV)/5)*5);hi=Math.ceil((hi+padV)/5)*5;
  const t0=fromISO(pts[0].date).getTime(),t1=fromISO(pts[pts.length-1].date).getTime();
  const x=d=>t1===t0?(pl+W-pr)/2:pl+(W-pl-pr)*(fromISO(d).getTime()-t0)/(t1-t0);
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g="";const st=5*Math.max(1,Math.ceil((hi-lo)/20));hi=lo+Math.ceil((hi-lo)/st)*st;const ticks=(hi-lo)/st;
  for(let k=0;k<=ticks;k++){const v=lo+(hi-lo)*k/ticks;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmtNum(Math.round(v*10)/10)}</text>`}
  g+=`<text x="${pl}" y="${H-6}">${fmtDate(pts[0].date,false)}</text>`;
  if(pts.length>1)g+=`<text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtDate(pts[pts.length-1].date,false)}</text>`;
  if(pts.length>1)g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+x(p.date)+','+y(p.value)).join('')}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p=>{g+=`<circle cx="${x(p.date)}" cy="${y(p.value)}" r="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/><circle cx="${x(p.date)}" cy="${y(p.value)}" r="16" fill="transparent" data-tip="${esc(p.tip)}"/>`});
  const last=pts[pts.length-1];
  g+=`<text x="${x(last.date)}" y="${y(last.value)-10}" text-anchor="${pts.length>1?'end':'middle'}" style="fill:var(--text-primary);font-weight:600">${fmtNum(last.value)} kg</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Viktprogression">${g}</svg>`;
}
function activityGrid(weeks){
  const cs=16,gap=3,pl=30,today=todayISO(),start=addDays(mondayOf(today),-7*(weeks-1));
  const dates=new Set(db.sessions.map(s=>s.date));
  let g='';
  [0,2,4].forEach(k=>g+=`<text x="${pl-6}" y="${k*(cs+gap)+cs-4}" text-anchor="end">${DOW_SHORT[(k+1)%7]}</text>`);
  for(let w=0;w<weeks;w++)for(let k=0;k<7;k++){
    const d=addDays(start,w*7+k);if(d>today)continue;
    const on=dates.has(d);
    g+=`<rect x="${pl+w*(cs+gap)}" y="${k*(cs+gap)}" width="${cs}" height="${cs}" rx="3" fill="${on?'var(--series-1)':'var(--surface-2)'}" data-tip="${esc(fmtDate(d)+(on?' – träning':' – vila'))}"/>`;
  }
  const W=pl+weeks*(cs+gap),H=7*(cs+gap);
  return `<svg viewBox="0 0 ${W} ${H}" style="max-width:${W*1.3}px" role="img" aria-label="Träningsdagar">${g}</svg>`;
}
function renderStats(){
  const S=db.sessions,today=todayISO();
  if(!S.length){view.innerHTML='<div class="card muted">Ingen data ännu.</div>';return}
  const inLast=n=>S.filter(s=>{const d=diffDays(s.date,today);return d>=0&&d<n});
  const dates=[...new Set(S.map(s=>s.date))];
  const lastDate=dates.find(d=>d<=today);
  // Pass per vecka, 12 veckor
  const mon0=mondayOf(today),weeks=[];
  for(let w=11;w>=0;w--){
    const m=addDays(mon0,-7*w),n=new Set(S.filter(s=>mondayOf(s.date)===m).map(s=>s.date)).size;
    weeks.push({label:'v'+isoWeek(m),value:n,tip:`Vecka ${isoWeek(m)} (${fmtDate(m,false)}–${fmtDate(addDays(m,6),false)})\n${n} träningsdagar`});
  }
  const avg=weeks.reduce((a,w)=>a+w.value,0)/12;
  // Muskelgrupper
  const last30=inLast(30);
  const mg=MUSCLES.map(m=>{
    const cnt=last30.filter(s=>musclesOf(s).includes(m)).length;
    const lastS=S.find(s=>s.date<=today&&musclesOf(s).includes(m));
    return{m,cnt,since:lastS?diffDays(lastS.date,today):null};
  }).sort((a,b)=>b.cnt-a.cnt||((a.since??999)-(b.since??999)));
  const maxCnt=Math.max(1,...mg.map(x=>x.cnt));
  const overdue=[...mg].filter(x=>x.since==null||x.since>=7).sort((a,b)=>(b.since??999)-(a.since??999)).slice(0,4);
  // Övningar
  const exs=exerciseNames().filter(x=>x.weighted>0);
  if(!selEx||!exs.some(x=>x.name.toLowerCase()===selEx))selEx=exs[0]&&exs[0].name.toLowerCase();
  let exHtml='<p class="muted">Logga övningar med vikt för att se progression.</p>';
  if(selEx){
    const pts=[];
    for(const s of [...S].reverse())for(const e of s.exercises)if(e.name.toLowerCase()===selEx){const w=maxW(e);if(isFinite(w))pts.push({date:s.date,value:w,tip:`${fmtDate(s.date)}\n${fmtSets(e)}`})}
    const pr=Math.max(...pts.map(p=>p.value)),first=pts[0],last=pts[pts.length-1];
    const prP=pts.find(p=>p.value===pr);
    const nm=exs.find(x=>x.name.toLowerCase()===selEx).name;
    exHtml=`<div class="row mb"><select id="exsel">${exs.map(x=>`<option value="${esc(x.name.toLowerCase())}" ${x.name.toLowerCase()===selEx?'selected':''}>${esc(x.name)} (${x.weighted})</option>`).join('')}</select>
      <button class="btn small" data-act="rename" data-name="${esc(nm)}">Byt namn</button></div>
      <div class="small" style="margin-bottom:6px">Rekord <b>${fmtNum(pr)} kg</b> <span class="muted">(${fmtDate(prP.date,false)})</span> · Senast <b>${fmtNum(last.value)} kg</b>${pts.length>1?` · Förändring <b>${last.value-first.value>=0?'+':''}${fmtNum(Math.round((last.value-first.value)*10)/10)} kg</b>`:''}</div>
      ${lineChart(pts)}
      <details class="mt"><summary>Visa tabell</summary><table><tr><th>Datum</th><th>Tyngst</th><th>Detaljer</th></tr>
      ${[...pts].reverse().map(p=>`<tr><td>${fmtDate(p.date,false)}</td><td>${fmtNum(p.value)} kg</td><td class="muted">${esc(p.tip.split('\n')[1])}</td></tr>`).join('')}</table></details>`;
  }
  view.innerHTML=`
    <div class="tiles">
      <div class="tile"><div class="v">${new Set(inLast(7).map(s=>s.date)).size}</div><div class="l">Pass senaste 7 dagarna</div></div>
      <div class="tile"><div class="v">${new Set(last30.map(s=>s.date)).size}</div><div class="l">Pass senaste 30 dagarna</div></div>
      <div class="tile"><div class="v">${fmtNum(Math.round(avg*10)/10)}</div><div class="l">Snitt pass/vecka (12 v)</div></div>
      <div class="tile"><div class="v">${lastDate?diffDays(lastDate,today):'–'}</div><div class="l">Dagar sedan senaste pass</div></div>
    </div>
    <div class="card"><h2>Pass per vecka</h2>${barChart(weeks)}</div>
    <div class="card"><h2>Träningsdagar</h2><div class="muted small" style="margin-bottom:8px">Senaste 16 veckorna – blå = tränat</div>${activityGrid(16)}</div>
    <div class="card"><h2>Muskelgrupper</h2>
      <div class="muted small" style="margin-bottom:10px">Antal pass senaste 30 dagarna (inkl. grupper som övningarna träffar)</div>
      ${mg.map(x=>`<div class="mbar" data-tip="${esc(`${x.m}: ${x.cnt} pass senaste 30 d`+(x.since!=null?`\nSenast för ${x.since} dagar sedan`:'\nAldrig loggat'))}"><span>${x.m}</span><div class="track"><div class="fill" style="width:${x.cnt/maxCnt*100}%"></div></div><span class="r">${x.cnt} · ${x.since==null?'aldrig':x.since===0?'idag':x.since+' d sedan'}</span></div>`).join('')}
      ${overdue.length?`<div class="small mt">⏳ <b>Längst sedan:</b> ${overdue.map(x=>`${x.m} (${x.since==null?'aldrig':x.since+' d'})`).join(', ')}</div>`:''}
    </div>
    <div class="card"><h2>Progression per övning</h2>${exHtml}</div>`;
  const sel=document.getElementById('exsel');if(sel)sel.onchange=()=>{selEx=sel.value;renderStats()};
}

/* ---------- Data ---------- */
function renderData(){
  view.innerHTML=`
  <div class="card"><h2>Importera från text</h2>
    <p class="small muted">Klistra in din logg i samma format som tidigare (“Måndag: bröst, bi, incline 155kg”). Intervall som “Onsdag-fredag: vila” fungerar. Ange vilket datum <b>sista raden</b> gäller – resten räknas ut bakåt. Befintliga pass på samma datum ersätts.</p>
    <textarea id="imptext" style="min-height:140px" placeholder="Lördag: ben, underarmar, vader&#10;Söndag: vila&#10;Måndag: bröst, bi, incline maskin 150kg"></textarea>
    <label class="mt">Datum för sista raden</label><input type="date" id="impdate" value="${todayISO()}">
    <button class="btn primary block mt" data-act="importText">Importera</button>
  </div>
  <div class="card"><h2>Backup</h2>
    <p class="small muted">All data sparas lokalt i den här webbläsaren. Exportera en backup då och då. På iPhone väljer du <b>Spara i Filer → iCloud Drive</b>.<br>Senaste backup: <b>${db.lastBackup?fmtDate(db.lastBackup):"aldrig"}</b></p>
    <div class="row"><button class="btn block" data-act="exportJson">Exportera (JSON)</button><button class="btn block" data-act="importJson">Återställ från fil</button></div>
    <input type="file" id="jsonfile" accept="application/json,.json" hidden>
  </div>
  <div class="card"><h2>Mallar</h2><p class="small muted">Har du tagit bort någon av standardmallarna kan du lägga tillbaka dem här.</p><button class="btn" data-act="resetTpl">Återställ standardmallar</button></div>
  <div class="card"><h2>Rensa</h2><p class="small muted">${db.sessions.length} pass sparade.</p><button class="btn danger" data-act="wipe">Radera all data</button></div>`;
  document.getElementById('jsonfile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!Array.isArray(d.sessions))throw 0;
      if(!confirm(`Ersätta nuvarande data med ${d.sessions.length} pass från filen?`))return;
      db=d;migrate();sortSessions();save();toast('Återställt');go('history')}
    catch(err){toast('Ogiltig fil')}
  };
}

/* ---------- Tooltip ---------- */
const tip=document.getElementById('tip');
function placeTip(e){const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY-r.height-14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(x<8)x=8;if(y<8)y=e.clientY+18;tip.style.left=x+'px';tip.style.top=y+'px'}
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;placeTip(e)});
document.addEventListener('pointermove',e=>{if(!tip.hidden)placeTip(e)});
document.addEventListener('scroll',()=>tip.hidden=true,{passive:true});

/* ---------- Vilotimer ---------- */
const tBtn=document.getElementById('timerBtn'),tBox=document.getElementById('timer');
let tEnd=0,tTick=null,actx=null,tLast=+localStorage.getItem('traningslogg.rest')||90;
const mmss=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
function beep(){
  if(!actx)return;const t0=actx.currentTime;
  [0,.35,.7].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;
    g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.5,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.28);
    os.connect(g).connect(actx.destination);os.start(t0+o);os.stop(t0+o+.3)});
}
function timerPanel(){
  const left=tEnd?Math.max(0,Math.ceil((tEnd-Date.now())/1000)):null;
  tBox.innerHTML=tEnd
    ?`<div class="tbig">${mmss(left)}</div><div class="row"><button class="btn" data-t="add">+15 s</button><button class="btn danger" data-t="stop">Stopp</button><button class="btn" data-t="hide">Dölj</button></div>`
    :`<div class="muted small" style="margin-bottom:8px">Vila mellan set</div><div class="row">${[60,90,120,180].map(s=>`<button class="btn ${s===tLast?'primary':''}" data-t="${s}">${mmss(s)}</button>`).join('')}</div><button class="btn small mt" data-t="hide">Stäng</button>`;
}
function tickTimer(){
  const left=Math.ceil((tEnd-Date.now())/1000);
  tBtn.textContent=left>0?mmss(left):'⏱';tBtn.classList.toggle('running',left>0);
  if(!tBox.hidden)timerPanel();
  if(left<=0){
    clearInterval(tTick);tEnd=0;beep();navigator.vibrate&&navigator.vibrate([300,150,300]);
    tBtn.textContent='Kör! 💪';tBtn.classList.add('done');
    setTimeout(()=>{tBtn.textContent='⏱';tBtn.classList.remove('done')},4000);
    if(!tBox.hidden)timerPanel();
  }
}
tBtn.onclick=()=>{tBox.hidden=!tBox.hidden;if(!tBox.hidden)timerPanel()};
tBox.onclick=e=>{
  const v=e.target.dataset.t;if(!v)return;
  if(v==='hide'){tBox.hidden=true;return}
  if(v==='stop'){clearInterval(tTick);tEnd=0;tBtn.textContent='⏱';tBtn.classList.remove('running');timerPanel();return}
  if(v==='add'){tEnd+=15000;tickTimer();return}
  // Ljud måste låsas upp av en knapptryckning på iPhone
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(err){}
  tLast=+v;localStorage.setItem('traningslogg.rest',v);
  tEnd=Date.now()+tLast*1000;clearInterval(tTick);tTick=setInterval(tickTimer,250);tickTimer();
  tBox.hidden=true;
};

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
go(['home','log','suggest','history','stats','data'].includes(location.hash.slice(1))?location.hash.slice(1):'home');
</script>
